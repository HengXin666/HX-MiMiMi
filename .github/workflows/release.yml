name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.p12
          chmod 600 release-keystore.p12

      - name: Build APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean test assembleRelease

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/HX-MiMiMi-release-signed.apk

      - name: Publish rolling release
        uses: ncipollo/release-action@v1
        with:
          tag: rolling-release
          name: HX MiMiMi Rolling Release
          artifacts: dist/HX-MiMiMi-release-signed.apk
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          body: |
            自动构建发布，不需要手动创建 tag。
            APK 已使用 GitHub Secrets 中的 release keystore 签名。
