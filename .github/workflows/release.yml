name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release-keystore.p12
            echo "✅ release-keystore.p12 已写入"
          else
            echo "⚠️ 未配置 RELEASE_KEYSTORE_BASE64，将使用 debug 签名"
          fi

      - name: Build Release APK
        env:
          RELEASE_KEYSTORE_FILE: ${{ github.workspace }}/release-keystore.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Rename artifact
        run: |
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" dist/HX-MiMiMi-release.apk
          echo "📦 $(basename "$APK") → dist/HX-MiMiMi-release.apk"

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-release
          name: HX MiMiMi Rolling Release
          files: dist/HX-MiMiMi-release.apk
          prerelease: false
          make_latest: true
          body: |
            自动构建发布，不需要手动创建 tag。
            APK 已使用 GitHub Secrets 中的 release keystore 签名。
