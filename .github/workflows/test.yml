name: Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello, GitHub Actions!"
      - name: Test secret access
        env:
          TEST: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: echo "Secret length: ${#TEST}"
