name: Test Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-nonexistent:
    runs-on: ubuntu-latest
    steps:
      - name: Test non-existent secret
        env:
          FAKE_SECRET: ${{ secrets.NONEXISTENT_SECRET }}
        run: echo "FAKE length: ${#FAKE_SECRET}"

  test-existing:
    runs-on: ubuntu-latest
    steps:
      - name: Test existing PASSWORD secret
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: echo "REAL length: ${#RELEASE_KEYSTORE_PASSWORD}"
