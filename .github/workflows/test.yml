name: Test Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-password:
    runs-on: ubuntu-latest
    steps:
      - name: Test PASSWORD secret
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: echo "PASSWORD length: ${#RELEASE_KEYSTORE_PASSWORD}"
